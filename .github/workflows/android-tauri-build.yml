name: Android Tauri Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - ".github/workflows/android-tauri-build.yml"
      - "package.json"
      - "package-lock.json"
      - "next.config.js"
      - "scripts/**"
      - "src/**"
      - "src-tauri/**"

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_APP_ENV: desktop
      NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
      NEXT_PUBLIC_API_BASE_URL: ${{ vars.NEXT_PUBLIC_API_BASE_URL }}
      NEXT_PUBLIC_DJANGO_URL: ${{ vars.NEXT_PUBLIC_DJANGO_URL }}

      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: |
            aarch64-linux-android
            armv7-linux-androideabi
            x86_64-linux-android
            i686-linux-android

      - name: Setup Android SDK
        # v3 requests the removed legacy `tools` package. v4 uses modern
        # command-line tools and lets us install only the packages we need.
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android SDK/NDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools" "ndk;26.1.10909125"

      - name: Configure Android SDK/NDK
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/26.1.10909125" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/26.1.10909125" >> "$GITHUB_ENV"
          echo "NDK_HOME=$ANDROID_SDK_ROOT/ndk/26.1.10909125" >> "$GITHUB_ENV"

      - name: Restore Android keystore (optional)
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' }}
        run: |
          mkdir -p src-tauri/gen/android
          echo "${ANDROID_KEYSTORE_BASE64}" | base64 --decode > src-tauri/gen/android/handypos-release.jks

      - name: Install dependencies
        run: npm ci

      - name: Show build configuration
        run: |
          node --version
          npm --version
          rustc --version
          cargo --version
          echo "NEXT_PUBLIC_APP_ENV=$NEXT_PUBLIC_APP_ENV"
          echo "NEXT_PUBLIC_API_URL=$NEXT_PUBLIC_API_URL"

      - name: Initialize Android project
        run: npm run tauri:android:init

      - name: Build Android APK/AAB
        run: |
          if [ -f src-tauri/gen/android/handypos-release.jks ]; then
            export ANDROID_KEYSTORE_PATH=src-tauri/gen/android/handypos-release.jks
          fi
          npm run tauri:android:build

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: handy-pos-android-${{ github.run_number }}
          if-no-files-found: error
          retention-days: 14
          path: |
            src-tauri/gen/android/app/build/outputs/apk/**/*.apk
            src-tauri/gen/android/app/build/outputs/bundle/**/*.aab
